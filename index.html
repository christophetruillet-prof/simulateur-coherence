<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Simulateur : cohérence temporelle et interférences</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    margin: 20px;
    background: #f7f8fb;
    color: #222;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 24px;
  }
  .layout {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }
  .panel {
    background: white;
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(20,20,40,0.06);
  }
  canvas {
    width: 85%; /* raccourci pour laisser de la place à droite */
    height: 160px;
    display: block;
    background: linear-gradient(#fff,#f6f9ff);
    border-radius: 6px;
  }
  .labels {
    position: relative;
    font-weight: 600;
    font-size: 14px;
    color: #223;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #rightPanel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 520px; /* même hauteur que les 3 graphes */
  }
  .intensityBox {
    flex: 1;
    width: 80px;
    border-radius: 6px;
    background: #000;
  }
  .panelTitle {
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 6px;
  }
</style>
</head>
<body>
  <h1>Simulateur : cohérence temporelle pour interférences</h1>

  <div class="layout">
    <div class="panel" style="flex:1">
      <div class="panelTitle">Évolution du champ électrique en fonction du temps en un point M donné</div>
      <div class="labels">Onde 1</div>
      <canvas id="canvas1" height="160"></canvas>
      <div class="labels">Onde 2</div>
      <canvas id="canvas2" height="160"></canvas>
      <div class="labels">Somme</div>
      <canvas id="canvasSum" height="160"></canvas>
    </div>

    <div class="panel" id="rightPanel" style="width:120px">
      <div class="panelTitle">Intensité lumineuse résultante</div>
      <div id="box1" class="intensityBox"></div>
      <div id="box2" class="intensityBox"></div>
      <div id="box3" class="intensityBox"></div>
    </div>
  </div>
<script src  = "chartmin.js"></script>
<script>
(() => {
  const c1 = document.getElementById('canvas1'),
        c2 = document.getElementById('canvas2'),
        cs = document.getElementById('canvasSum');
  const ctx1 = c1.getContext('2d'),
        ctx2 = c2.getContext('2d'),
        ctxs = cs.getContext('2d');
  const box1 = document.getElementById('box1'),
        box2 = document.getElementById('box2'),
        box3 = document.getElementById('box3');

  let running = true;
  let lastTS = null;
  let t = 0;
  let phi1 = Math.random()*Math.PI*2, phi2 = Math.random()*Math.PI*2;
  let lastReset = 0;

  const speed = 0.2;
  const f1 = 10, f2 = 10;
  const a1 = 1, a2 = 1;
  const tauVal = 0.2;
  const driftRate = 0;

  function drawWave(ctx, width, height, dataFunc, color='#134', scale=1) {
    ctx.clearRect(0,0,width,height);
    ctx.strokeStyle = 'rgba(50,60,80,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0,height/2);
    ctx.lineTo(width,height/2);
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.strokeStyle = color;
    ctx.beginPath();
    const samples = width;
    for (let x=0;x<samples;x++){
      const s = dataFunc(x/samples);
      const y = height/2 - s*(height*0.38/scale);
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  function updateIntensity(element, value) {
    const intensity = Math.min(1, value*value);
    const red = Math.floor(255 * intensity);
    element.style.backgroundColor = `rgb(${red},0,0)`;
  }

  function step(timestamp){
    if (!running) return;
    if (lastTS===null) lastTS = timestamp;
    const dt_ms = timestamp - lastTS; lastTS = timestamp;
    const dt = dt_ms/1000 * speed;
    t += dt;

    if (t - lastReset >= tauVal) {
      phi1 = Math.random()*Math.PI*2;
      phi2 = Math.random()*Math.PI*2;
      lastReset = t;
    }

    phi1 += driftRate * dt;
    phi2 += -driftRate * dt;
    phi1 %= (2*Math.PI);
    phi2 %= (2*Math.PI);

    const width = c1.width = c1.clientWidth*devicePixelRatio;
    const height = c1.height = 160*devicePixelRatio;
    c2.width = width; c2.height = height; cs.width = width; cs.height = height;

    const wFunc1 = (u)=>a1*Math.sin(2*Math.PI*f1*(u+t)+phi1);
    const wFunc2 = (u)=>a2*Math.sin(2*Math.PI*f2*(u+t)+phi2);

    // même échelle pour les 3
    const scale = 2;
    drawWave(ctx1, width, height, wFunc1, '#134', scale);
    drawWave(ctx2, width, height, wFunc2, '#134', scale);

    let maxVal = 0;
    const sumFunc = (u)=>{
      const v = wFunc1(u)+wFunc2(u);
      if (Math.abs(v)>maxVal) maxVal=Math.abs(v);
      return v;
    };
    drawWave(ctxs, width, height, sumFunc, '#a42', scale);

    // intensité lumineuse (rouge ∝ amplitude²)
    updateIntensity(box1, wFunc1(0));
    updateIntensity(box2, wFunc2(0));
    updateIntensity(box3, sumFunc(0));

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
})();
</script>
</body>
</html>
