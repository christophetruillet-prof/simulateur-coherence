<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Simulateur : cohérence temporelle & interférences</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin:20px; background:#f7f8fb; color:#222; }
  h1 { font-size:20px; margin-bottom:8px; }
  .layout { display:grid; grid-template-columns: 1fr 320px; gap:16px; align-items:start; }
  .panel { background:white; border-radius:8px; padding:12px; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
  canvas { width:100%; height:160px; display:block; background:linear-gradient(#fff,#f6f9ff); border-radius:6px; }
  label { display:block; margin-top:8px; font-size:13px; }
  input[type=range] { width:100%; }
  .row { display:flex; gap:8px; align-items:center; }
  button { padding:8px 12px; border-radius:6px; border:1px solid #cfd8e6; background:#fff; cursor:pointer; }
  .small { font-size:12px; color:#555; }
</style>
</head>
<body>
  <h1>Simulateur : cohérence temporelle et enveloppe d’intensité</h1>
  <div class="layout">
    <div class="panel">
      <canvas id="canvas1" height="160"></canvas>
      <canvas id="canvas2" height="160" style="margin-top:10px"></canvas>
      <canvas id="canvasSum" height="160" style="margin-top:10px"></canvas>
    </div>

    <div class="panel">
      <div class="row"><button id="playBtn">⏵ Play</button><button id="resetBtn">↺ Réinitialiser</button></div>

      <label>Vitesse globale : <span id="speedVal">1.0</span>
        <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1">
      </label>

      <label>Fréquence onde 1 (Hz): <span id="f1Val">5.0</span>
        <input id="f1" type="range" min="0.5" max="20" step="0.1" value="5">
      </label>

      <label>Fréquence onde 2 (Hz): <span id="f2Val">5.0</span>
        <input id="f2" type="range" min="0.5" max="20" step="0.1" value="5">
      </label>

      <label>Amplitude 1: <span id="a1Val">1.0</span>
        <input id="a1" type="range" min="0" max="2" step="0.01" value="1">
      </label>

      <label>Amplitude 2: <span id="a2Val">1.0</span>
        <input id="a2" type="range" min="0" max="2" step="0.01" value="1">
      </label>

      <label>Type d'évolution de phase :
        <select id="phaseMode">
          <option value="reset">Reset aléatoire (coherence time)</option>
          <option value="linear">Dérive linéaire</option>
          <option value="noise">Bruit continu (petite diffusion)</option>
        </select>
      </label>

      <label>Temps de cohérence / période de reset (s): <span id="tauVal">1.0</span>
        <input id="tau" type="range" min="0.1" max="10" step="0.1" value="1">
      </label>

      <label>Vitesse de dérive (rad/s) / intensité bruit : <span id="driftVal">0.0</span>
        <input id="drift" type="range" min="-10" max="10" step="0.1" value="0">
      </label>

      <label><input id="showEnvelope" type="checkbox"> Afficher l’enveloppe d’intensité moyenne</label>

      <p class="small">
        L’échelle de la somme est fixe (A₁ + A₂).  
        L’enveloppe montre la valeur moyenne ⟨E²⟩ ∝ intensité.
      </p>
    </div>
  </div>

<script>
(() => {
  const c1 = document.getElementById('canvas1'),
        c2 = document.getElementById('canvas2'),
        cs = document.getElementById('canvasSum');
  const ctx1 = c1.getContext('2d'),
        ctx2 = c2.getContext('2d'),
        ctxs = cs.getContext('2d');

  const playBtn = document.getElementById('playBtn'),
        resetBtn = document.getElementById('resetBtn'),
        showEnv = document.getElementById('showEnvelope');
  const speed = document.getElementById('speed'), speedVal = document.getElementById('speedVal');
  const f1s = document.getElementById('f1'), f1Val = document.getElementById('f1Val');
  const f2s = document.getElementById('f2'), f2Val = document.getElementById('f2Val');
  const a1s = document.getElementById('a1'), a1Val = document.getElementById('a1Val');
  const a2s = document.getElementById('a2'), a2Val = document.getElementById('a2Val');
  const phaseMode = document.getElementById('phaseMode');
  const tau = document.getElementById('tau'), tauVal = document.getElementById('tauVal');
  const drift = document.getElementById('drift'), driftVal = document.getElementById('driftVal');

  function updateLabels(){
    speedVal.textContent = speed.value;
    f1Val.textContent = f1s.value;
    f2Val.textContent = f2s.value;
    a1Val.textContent = a1s.value;
    a2Val.textContent = a2s.value;
    tauVal.textContent = tau.value;
    driftVal.textContent = drift.value;
  }
  [speed,f1s,f2s,a1s,a2s,tau,drift].forEach(el=>el.addEventListener('input',updateLabels));
  updateLabels();

  let running = false;
  let lastTS = null;
  let t = 0;
  let phi1 = Math.random()*Math.PI*2, phi2 = Math.random()*Math.PI*2;
  let lastReset = 0;

  function drawWave(ctx, width, height, dataFunc, color='#134', scale=1, dashed=false) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    if (dashed) ctx.setLineDash([6,4]); else ctx.setLineDash([]);
    ctx.beginPath();
    const samples = width;
    for (let x=0;x<samples;x++){
      const s = dataFunc(x/samples);
      const y = height/2 - s*(height*0.38/scale);
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  function clearCanvas(ctx, width, height){
    ctx.clearRect(0,0,width,height);
    ctx.strokeStyle = 'rgba(50,60,80,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0,height/2);
    ctx.lineTo(width,height/2);
    ctx.stroke();
  }

  function step(timestamp){
    if (!running) { lastTS = null; return; }
    if (lastTS===null) lastTS = timestamp;
    const dt = (timestamp - lastTS)/1000 * parseFloat(speed.value);
    lastTS = timestamp;
    t += dt;

    const f1 = parseFloat(f1s.value), f2 = parseFloat(f2s.value);
    const a1 = parseFloat(a1s.value), a2 = parseFloat(a2s.value);
    const mode = phaseMode.value;
    const tauVal = parseFloat(tau.value);
    const driftRate = parseFloat(drift.value);

    if (mode === 'reset') {
      if (t - lastReset >= tauVal) {
        phi1 = Math.random()*Math.PI*2;
        phi2 = Math.random()*Math.PI*2;
        lastReset = t;
      }
    } else if (mode === 'linear') {
      phi1 += driftRate * dt;
      phi2 += (-driftRate*0.4) * dt;
    } else if (mode === 'noise') {
      const sigma = Math.abs(driftRate);
      phi1 += sigma * (Math.random()-0.5)*0.5;
      phi2 += sigma * (Math.random()-0.5)*0.5;
    }

    const width = c1.width = c1.clientWidth*devicePixelRatio;
    const height = 160*devicePixelRatio;
    c1.height = c2.height = cs.height = height;
    c2.width = cs.width = width;

    const wFunc1 = (u)=>a1*Math.sin(2*Math.PI*f1*(u+t)+phi1);
    const wFunc2 = (u)=>a2*Math.sin(2*Math.PI*f2*(u+t)+phi2);
    clearCanvas(ctx1, width, height); drawWave(ctx1, width, height, wFunc1, '#134');
    clearCanvas(ctx2, width, height); drawWave(ctx2, width, height, wFunc2, '#134');

    const Amax = a1 + a2;
    clearCanvas(ctxs, width, height);
    drawWave(ctxs, width, height, (u)=>wFunc1(u)+wFunc2(u), '#a42', Amax);

    // Ajout de l’enveloppe d’intensité moyenne
    if (showEnv.checked) {
      const Δφ = phi2 - phi1;
      const Imax = (a1*a1 + a2*a2 + 2*a1*a2*Math.cos(Δφ));
      const I = Math.sqrt(Imax)/Amax; // normalisé
      drawWave(ctxs, width, height, ()=> I, 'black', 1, true);
      drawWave(ctxs, width, height, ()=>-I, 'black', 1, true);
    }

    requestAnimationFrame(step);
  }

  playBtn.addEventListener('click', ()=> {
    running = !running;
    playBtn.textContent = running ? '⏸ Pause' : '⏵ Play';
    if (running) requestAnimationFrame(step);
  });

  resetBtn.addEventListener('click', ()=> {
    t = 0; phi1 = Math.random()*Math.PI*2; phi2 = Math.random()*Math.PI*2; lastReset = 0;
    const a1 = parseFloat(a1s.value), a2 = parseFloat(a2s.value);
    clearCanvas(ctx1, c1.width, c1.height);
    clearCanvas(ctx2, c2.width, c2.height);
    clearCanvas(ctxs, cs.width, cs.height);
    drawWave(ctxs, cs.width, cs.height, ()=>0, '#a42', a1+a2);
  });

  resetBtn.click();
})();
</script>
</body>
</html>
