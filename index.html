<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur de cohérence temporelle</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: sans-serif;
    background: #f5f5f5;
    margin: 20px;
    text-align: center;
  }
  h2 {
    color: #333;
  }
  .container {
    max-width: 800px;
    margin: auto;
  }
  canvas {
    background: white;
    margin: 20px 0;
    width: 100%;
    height: 300px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .controls {
    background: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  .slider {
    width: 80%;
    margin: 10px;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>🌊 Simulateur de cohérence temporelle</h2>
    <div class="controls">
      <label>Différence de phase initiale (°): 
        <input type="range" id="phaseSlider" min="0" max="360" value="0" class="slider">
        <span id="phaseValue">0°</span>
      </label><br>
      <label>Fréquence (Hz): 
        <input type="range" id="freqSlider" min="1" max="10" value="2" class="slider">
        <span id="freqValue">2 Hz</span>
      </label>
    </div>
    <canvas id="waveCanvas"></canvas>
    <canvas id="sumCanvas"></canvas>
  </div>

<script scr="chart.js">
const waveCtx = document.getElementById('waveCanvas').getContext('2d');
const sumCtx = document.getElementById('sumCanvas').getContext('2d');

const N = 300;
const x = Array.from({length: N}, (_, i) => i / 100);
let phase = 0;
let freq = 2;
const amp = 1;

// Échelle fixe pour la somme : ±2
const yScale = 2.2;

// Création des graphiques
const waveChart = new Chart(waveCtx, {
  type: 'line',
  data: {
    labels: x,
    datasets: [
      { label: 'Onde 1', data: [], borderColor: 'blue', borderWidth: 2, fill: false },
      { label: 'Onde 2', data: [], borderColor: 'red', borderWidth: 2, fill: false }
    ]
  },
  options: {
    animation: false,
    scales: {
      y: { min: -1.2, max: 1.2 },
      x: { title: { display: true, text: 'Temps (s)' } }
    }
  }
});

const sumChart = new Chart(sumCtx, {
  type: 'line',
  data: {
    labels: x,
    datasets: [{ label: 'Somme des deux ondes', data: [], borderColor: 'green', borderWidth: 2, fill: false }]
  },
  options: {
    animation: false,
    scales: {
      y: { min: -yScale, max: yScale },
      x: { title: { display: true, text: 'Temps (s)' } }
    }
  }
});

// Animation des ondes
function updateCharts(t) {
  const phi = phase * Math.PI / 180;
  const y1 = x.map(v => amp * Math.sin(2 * Math.PI * freq * v + 2 * Math.PI * freq * t));
  const y2 = x.map(v => amp * Math.sin(2 * Math.PI * freq * v + phi + 2 * Math.PI * freq * t));
  const ySum = y1.map((v, i) => v + y2[i]);

  waveChart.data.datasets[0].data = y1;
  waveChart.data.datasets[1].data = y2;
  sumChart.data.datasets[0].data = ySum;

  waveChart.update();
  sumChart.update();
}

// Sliders
document.getElementById('phaseSlider').oninput = e => {
  phase = e.target.value;
  document.getElementById('phaseValue').innerText = phase + "°";
};
document.getElementById('freqSlider').oninput = e => {
  freq = e.target.value;
  document.getElementById('freqValue').innerText = freq + " Hz";
};

// Boucle d'animation
let start = null;
function animate(timestamp) {
  if (!start) start = timestamp;
  const t = (timestamp - start) / 1000;
  updateCharts(t);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
